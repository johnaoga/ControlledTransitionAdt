[package]
name = "phase-specialized-cts"
version = "0.1.0"
edition = "2021"
description = "Phase-specialized data structures for symbolic abstraction-based controller synthesis"
license = "MIT"

# See specs.md for architecture rationale.

[dependencies]
# Optional decision-diagram backends (BDD, complement-edge BDD) — feature-gated.
# 0.6 overflowed the stack once a second manager in the process ran a GC; keep >= 0.13.
oxidd = { version = "0.13", optional = true }
# SHA-256 checksum of the canonical triple stream in trace headers.
sha2 = "0.10"

[dev-dependencies]
# Statistical microbenchmarks
criterion = { version = "0.5", features = ["html_reports"] }
# Randomized property-based conformance testing
proptest = "1"

[features]
default = []
oxidd = ["dep:oxidd"]

[[bench]]
name = "operations"
harness = false

[[bin]]
name = "five_state"
path = "src/bin/five_state.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
